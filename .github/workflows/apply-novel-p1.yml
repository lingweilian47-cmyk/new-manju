name: Apply Novel P1 Adapter

on:
  push:
    branches:
      - "feat/novel-to-screenplay-p1"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: "feat/novel-to-screenplay-p1"
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/apply_novel_p1_patch.py

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          python3 short-drama-director/scripts/check_package.py
          python3 -m json.tool short-drama-director/plugin.json >/dev/null
          python3 -m json.tool short-drama-director/.codex-plugin/plugin.json >/dev/null
          git diff --check

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_novel_p1_patch.py .github/workflows/apply-novel-p1.yml
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add minimal-delta novel-to-screenplay P1 mode"
          git push origin HEAD:feat/novel-to-screenplay-p1
