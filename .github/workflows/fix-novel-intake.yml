name: Fix Novel Intake Clarification

on:
  push:
    branches:
      - "feat/novel-to-screenplay-p1"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: "feat/novel-to-screenplay-p1"
          fetch-depth: 0

      - name: Apply clarification
        run: python3 tools/fix_novel_intake.py

      - name: Validate package
        run: |
          set -euo pipefail
          python3 short-drama-director/scripts/check_package.py
          git diff --check

      - name: Commit changes
        run: |
          set -euo pipefail
          rm -f tools/fix_novel_intake.py .github/workflows/fix-novel-intake.yml
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align novel intake with read-first confirmation"
          git push origin HEAD:feat/novel-to-screenplay-p1
